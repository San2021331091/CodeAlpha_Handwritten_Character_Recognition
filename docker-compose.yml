services:
  ml:
    build: ./ml-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:8100/health'))['model_loaded']"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  gateway:
    build: ./backend-gateway
    environment:
      ML_SERVICE_URL: http://ml:8100
      GATEWAY_ADDR: 0.0.0.0:3101
    depends_on:
      ml:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        GATEWAY_URL: http://gateway:3101
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      - gateway
    restart: unless-stopped
